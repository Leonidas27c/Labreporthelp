name: Release (Windows-Paket)

# Neues Release: einen Tag wie v0.1.0 pushen. Dann wird das Windows-Paket gebaut
# und als "Labreporthelp-windows.zip" an das Release auf GitHub gehängt.
# Oder von Hand: Actions → „Release (Windows-Paket)“ → Run workflow, dort die Version
# (z. B. v0.1.0) eintragen. Ohne Version wird nur das Paket gebaut, ohne Release.
on:
  push:
    tags: ['v*']
  workflow_dispatch:
    inputs:
      version:
        description: 'Version für das Release, z. B. v0.1.0 (leer lassen = nur Paket bauen)'
        required: false
        default: ''

permissions:
  contents: write

jobs:
  paket:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci --no-audit --no-fund
      - run: bash scripts/package-release.sh release-out
      - uses: actions/upload-artifact@v4
        with:
          name: Labreporthelp-windows
          path: release-out/Labreporthelp-windows.zip
      - name: Release anlegen
        if: startsWith(github.ref, 'refs/tags/') || inputs.version != ''
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ inputs.version != '' && inputs.version || github.ref_name }}
        run: |
          gh release create "$VERSION" release-out/Labreporthelp-windows.zip \
            --target "$GITHUB_SHA" \
            --title "Labreporthelp $VERSION" \
            --notes-file release/RELEASE_NOTES.md
